name: 'playstore_analytics'
version: '1.0.0'
config-version: 2

profile: 'playstore_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Model materialization conventions by folder
models:
  playstore_analytics:
    staging:
      +materialized: view
      +schema: staging
    marts:
      dimensions:
        +materialized: table
        +schema: marts
      facts:
        +materialized: table
        +schema: marts

snapshots:
  playstore_analytics:
    +target_schema: snapshots
